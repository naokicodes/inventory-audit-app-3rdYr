<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Sales (Loyverse) - Inventory Audit App</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Step loyverse-preview-iv: a Loyverse-style date bar + sync. Page-local
       so style.css is untouched (parallel-safe with warn-ink, self-host-font).
       Phone first: the bar fits at 390px. */
    .ks-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin: 0.75rem 0 0.5rem;
    }
    .ks-arrow {
      min-width: 2.75rem; min-height: 2.75rem;
      font-size: 1.25rem; line-height: 1; padding: 0.25rem 0.5rem;
    }
    .ks-arrow:disabled { opacity: 0.4; cursor: default; }
    .ks-date-wrap { position: relative; display: inline-flex; }
    .ks-date-label {
      display: inline-block; min-width: 9rem; text-align: center;
      font-size: 1.1rem; font-weight: 600; padding: 0.5rem 0.75rem;
      cursor: pointer; white-space: nowrap;
    }
    /* The native picker sits invisibly over the label: tapping it opens the
       phone's date picker even where showPicker() is unavailable. */
    .ks-date-input {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; border: 0; padding: 0; margin: 0; cursor: pointer;
    }
    .ks-sync { text-align: center; margin: 0 0 0.75rem; }
    #last-receipt, #synced { margin: 0.2rem 0; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="daily-audit.html">Landing</a>
    <a href="stock-receipts.html">Stock Receipts</a>
    <a href="commissary.html">Commissary</a>
    <a href="commissary-shipments.html">Shipments</a>
    <a href="sales.html">Sales</a>
    <a href="terminal.html">Terminal</a>
    <a href="allocations.html">Allocations</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="settings.html">Settings</a>
    <a href="history.html">History</a>
  </nav>

  <h1>Kitchen Sales (Loyverse)</h1>
  <p class="ks-note">Preview - read-only, nothing is saved</p>

  <div class="ks-bar">
    <button type="button" id="prev-btn" class="ks-arrow" aria-label="Previous day">&lsaquo;</button>
    <span class="ks-date-wrap">
      <span id="date-label" class="ks-date-label"></span>
      <input type="date" id="date-input" class="ks-date-input" aria-label="Choose a date">
    </span>
    <button type="button" id="next-btn" class="ks-arrow" aria-label="Next day">&rsaquo;</button>
  </div>
  <div class="ks-sync">
    <button type="button" id="sync-btn">Sync with Loyverse</button>
  </div>

  <div id="banners"></div>
  <p id="loading" class="ks-note" hidden>Loading...</p>
  <p id="last-receipt" class="ks-note"></p>
  <p id="synced" class="ks-note"></p>

  <div id="result" hidden>
    <div class="table-scroll">
      <table id="sales-table">
        <thead>
          <tr><th>Dish</th><th class="num">Likod</th><th class="num">Silingan</th><th class="num">Total</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="account-status"></div>

    <div id="unmatched" hidden>
      <h2>Unmatched</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Account</th><th>Item name</th><th class="num">Qty</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="save-bar">
      <button id="copy-btn">Copy as text</button>
      <span id="copy-status" class="status-message"></span>
    </div>
    <textarea id="copy-text" rows="8" readonly hidden></textarea>
  </div>

  <script>
    // Step loyverse-preview-iv: the Kitchen Sales page for
    // GET /api/loyverse/preview. The sales day turns at 8am (ADR-033), so the
    // default date is today's business date (before 8am Manila = yesterday).
    // Temporary - linked from Home only. Still read-only, nothing is saved.
    const COLUMNS = [
      { key: 'likod', label: 'Likod' },
      { key: 'silingan', label: 'Silingan' },
    ];
    const TZ = 'Asia/Manila';
    const BUSINESS_DAY_START_MS = 8 * 60 * 60 * 1000;

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const dateLabel = document.getElementById('date-label');
    const dateInput = document.getElementById('date-input');
    const syncBtn = document.getElementById('sync-btn');
    const bannersEl = document.getElementById('banners');
    const loadingEl = document.getElementById('loading');
    const lastReceiptEl = document.getElementById('last-receipt');
    const syncedEl = document.getElementById('synced');
    const resultEl = document.getElementById('result');
    const copyBtn = document.getElementById('copy-btn');
    const copyStatus = document.getElementById('copy-status');
    const copyText = document.getElementById('copy-text');

    let current = null;
    let selected = null;

    // --- business-date helpers (mirror the engine's 8am rule) ---
    function manilaDateOf(ms) {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      }).format(new Date(ms));
    }
    function currentBusinessDate() {
      return manilaDateOf(Date.now() - BUSINESS_DAY_START_MS);
    }
    function addDaysStr(dateStr, n) {
      const d = new Date(dateStr + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }
    // "Fri, Oct 30" - parsed at UTC noon so the calendar date never rolls over.
    function labelFor(dateStr) {
      const d = new Date(dateStr + 'T12:00:00Z');
      return new Intl.DateTimeFormat('en-US', {
        timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric',
      }).format(d);
    }
    // Manila wall-clock, 12-hour: "9:12 PM", "12:48 AM".
    function timeFor(instant) {
      return new Intl.DateTimeFormat('en-US', {
        timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true,
      }).format(new Date(instant));
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // A null value is a failed account or a null total: "-", never 0.
    function show(v) {
      return v === null || v === undefined ? '-' : String(v);
    }

    // A numeric table cell. A "-" (failed account or null total) keeps normal
    // ink even inside a muted zero row - a failure must never read as a zero.
    function numCell(v) {
      const dash = v === null || v === undefined;
      return `<td class="num${dash ? ' ks-dash' : ''}">${dash ? '-' : esc(String(v))}</td>`;
    }

    function failedAccounts(data) {
      return data.accounts.filter(a => !a.ok);
    }

    function failureLine(a) {
      return `${a.label} could not be fetched: ${a.error}`;
    }

    function banner(text) {
      bannersEl.insertAdjacentHTML('beforeend', `<p class="status-message error">${esc(text)}</p>`);
    }

    // "Last kitchen receipt: Silingan 9:12 PM - Likod 12:48 AM". An ok account
    // with no kitchen receipt reads "none yet"; a failed account reads "-"
    // (its banner says why).
    function lastReceiptText(data) {
      const parts = data.accounts.map(a => {
        if (!a.ok) return `${a.label} -`;
        return `${a.label} ${a.lastReceiptAt ? timeFor(a.lastReceiptAt) : 'none yet'}`;
      });
      return `Last kitchen receipt: ${parts.join(' - ')}`;
    }

    function syncedText(data) {
      let s = `Synced ${timeFor(Date.now())}`;
      if (data.date === currentBusinessDate()) s += ' - this day stays open until 8:00 AM';
      return s;
    }

    function render(data) {
      bannersEl.innerHTML = '';
      failedAccounts(data).forEach(a => banner(failureLine(a)));

      lastReceiptEl.textContent = lastReceiptText(data);
      syncedEl.textContent = syncedText(data);

      document.querySelector('#sales-table tbody').innerHTML = data.dishes.map(d => {
        const zero = d.total === 0;
        return `<tr${zero ? ' class="ks-zero"' : ''}><td>${esc(d.name)}</td>` +
          COLUMNS.map(c => numCell(d[c.key])).join('') +
          numCell(d.total) + `</tr>`;
      }).join('');

      document.getElementById('account-status').innerHTML = data.accounts.map(a => {
        if (!a.ok) return `<p class="ks-note">${esc(a.label)}: could not be fetched</p>`;
        const refunds = (a.receiptTypes && a.receiptTypes.REFUND) || 0;
        return `<p class="ks-note">${esc(a.label)}: ${a.receiptsKept} receipt${a.receiptsKept === 1 ? '' : 's'}, ${refunds} refund${refunds === 1 ? '' : 's'}</p>`;
      }).join('');

      const unmatchedEl = document.getElementById('unmatched');
      unmatchedEl.hidden = data.unmatched.length === 0;
      unmatchedEl.querySelector('tbody').innerHTML = data.unmatched.map(u =>
        `<tr><td>${esc(u.account)}</td><td>${esc(u.item_name)}</td><td class="num">${esc(u.quantity)}</td></tr>`
      ).join('');

      copyStatus.textContent = '';
      copyStatus.className = 'status-message';
      copyText.hidden = true;
      resultEl.hidden = false;
    }

    async function load() {
      syncBtn.disabled = true;
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      loadingEl.hidden = false;
      resultEl.hidden = true;
      bannersEl.innerHTML = '';
      try {
        const res = await fetch(`/api/loyverse/preview?date=${encodeURIComponent(selected)}`);
        // A proxy or crash page may not be JSON: report the HTTP status, not a parse error.
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        current = body;
        render(body);
      } catch (err) {
        current = null;
        lastReceiptEl.textContent = '';
        syncedEl.textContent = '';
        banner(`Could not load sales: ${err.message}`);
      } finally {
        syncBtn.disabled = false;
        prevBtn.disabled = false;
        // ">" stays disabled on the current business date.
        nextBtn.disabled = selected >= currentBusinessDate();
        loadingEl.hidden = true;
      }
    }

    // Move to a date: update the bar, then load it.
    function setSelected(dateStr) {
      selected = dateStr;
      dateLabel.textContent = labelFor(selected);
      dateInput.value = selected;
      nextBtn.disabled = selected >= currentBusinessDate();
      load();
    }

    // Messenger text: the Last kitchen receipt line after the header, then
    // non-zero dishes only; a null-total dish is left out because the
    // failed-account warning covers it (#27).
    function asText(data) {
      const lines = [`Kitchen Sales (Loyverse) - ${data.date}`, lastReceiptText(data)];
      data.dishes.filter(d => d.total !== null && d.total > 0).forEach(d => {
        lines.push(`${d.name} - ${COLUMNS.map(c => `${c.label} ${show(d[c.key])}`).join(', ')}, Total ${d.total}`);
      });
      if (data.unmatched.length > 0) {
        const n = data.unmatched.length;
        lines.push(`Unmatched: ${n} item${n === 1 ? '' : 's'} (see app)`);
      }
      failedAccounts(data).forEach(a => lines.push(failureLine(a)));
      return lines.join('\n');
    }

    // navigator.clipboard needs HTTPS or localhost; a LAN http:// address
    // falls back to execCommand, then to a textarea for manual copy.
    function execCopy(text) {
      copyText.value = text;
      copyText.hidden = false;
      copyText.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) copyText.hidden = true;
      return ok;
    }

    async function copy() {
      if (!current) return;
      const text = asText(current);
      let ok = false;
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
      }
      if (!ok) ok = execCopy(text);
      copyStatus.className = ok ? 'status-message success' : 'status-message error';
      copyStatus.textContent = ok ? 'Copied' : 'Copy failed - select the text below and copy it';
    }

    prevBtn.addEventListener('click', () => setSelected(addDaysStr(selected, -1)));
    nextBtn.addEventListener('click', () => { if (!nextBtn.disabled) setSelected(addDaysStr(selected, 1)); });
    dateInput.addEventListener('change', () => { if (dateInput.value) setSelected(dateInput.value); });
    // Desktop: open the picker from the label. Mobile: the invisible input over
    // the label already opens it on tap.
    dateInput.addEventListener('click', () => {
      if (typeof dateInput.showPicker === 'function') {
        try { dateInput.showPicker(); } catch (e) { /* already open / unsupported */ }
      }
    });
    syncBtn.addEventListener('click', load);
    copyBtn.addEventListener('click', copy);

    // Default: the current business date, loaded on open.
    setSelected(currentBusinessDate());
  </script>
</body>
</html>
