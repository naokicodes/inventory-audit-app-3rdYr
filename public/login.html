<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Inventory Audit App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#222121">
  <style>
    .user-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .user-list button { text-align: left; min-height: 48px; font-size: 1.05rem; }
    .login-h2 { font-size: 1rem; color: var(--ink2); margin: 1.25rem 0 0.5rem; }
    #find { width: 100%; box-sizing: border-box; padding: 0.6rem; font-size: 1rem; }
    .find-label { display: block; font-weight: 600; margin: 1.25rem 0 0.4rem; }
    .admin-login { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.25rem 0 0.75rem; }
    .admin-login[hidden] { display: none; }
    .admin-login label { font-weight: 600; }
    #admin-password { width: 100%; box-sizing: border-box; padding: 0.6rem; font-size: 1rem; }
    .user-list .admin-login button { min-height: 48px; font-size: 1.05rem; text-align: center; }
  </style>
</head>
<body data-shell="login">
  <nav></nav>
  <script src="shell.js"></script>
  <!-- Step stub-login: pick your name, no password. Identity only.
       Step ui-shell (ADR-111): this phone's recent names first, then a find
       box over everyone, A to Z.
       Step sign-the-cookie (ADR-098): an admin's name opens the Admin
       password box under it; every other name logs in on one tap. -->
  <h1>Log in</h1>
  <section id="recent" hidden>
    <h2 class="login-h2">On this phone</h2>
    <div id="recent-list" class="user-list"></div>
  </section>
  <label class="find-label" for="find">Find your name</label>
  <input type="text" id="find" autocomplete="off" autocapitalize="off" spellcheck="false">
  <h2 class="login-h2">Everyone</h2>
  <div id="user-list" class="user-list"></div>
  <p id="login-message" class="status-message"></p>
  <form id="admin-login" class="admin-login" hidden>
    <label for="admin-password">Admin password</label>
    <input type="password" id="admin-password" autocomplete="current-password">
    <button type="submit">Log in</button>
    <p id="admin-message" class="status-message" role="alert"></p>
  </form>
  <script>
    const listEl = document.getElementById('user-list');
    const recentEl = document.getElementById('recent');
    const recentListEl = document.getElementById('recent-list');
    const findEl = document.getElementById('find');
    const messageEl = document.getElementById('login-message');
    const RECENT_KEY = 'recentLogins';

    function showError(text) {
      messageEl.textContent = text;
      messageEl.classList.add('error');
    }

    // Ignore capitals and extra spaces.
    function norm(s) {
      return String(s).toLowerCase().replace(/\s+/g, ' ').trim();
    }

    // recentLogins: this device's last three logins, newest first, as
    // [{ id, name }]. Per device only; storage that fails just means no list.
    function readRecent() {
      try {
        const list = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
        return Array.isArray(list) ? list : [];
      } catch (err) {
        return [];
      }
    }

    function saveRecent(user) {
      try {
        const list = readRecent().filter((r) => r && r.id !== user.id);
        list.unshift({ id: user.id, name: user.name });
        localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 3)));
      } catch (err) { /* no storage: nothing remembered */ }
    }

    const adminForm = document.getElementById('admin-login');
    const passwordEl = document.getElementById('admin-password');
    const adminMessageEl = document.getElementById('admin-message');
    const loginButton = adminForm.querySelector('button');
    let adminUser = null;

    // `onRefused` shows the server's message; the default is the page message.
    async function logIn(user, password, onRefused = showError) {
      let res;
      try {
        res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(password === undefined ? { user_id: user.id } : { user_id: user.id, password }),
        });
      } catch (err) {
        onRefused('Could not log in.');
        return;
      }
      if (res.ok) {
        saveRecent(user);
        location.href = 'index.html';
      } else {
        const body = await res.json().catch(() => ({}));
        onRefused(body.error || 'Could not log in.');
      }
    }

    // An admin's name: the password box moves under the tapped button.
    function askPassword(user, btn) {
      adminUser = user;
      btn.after(adminForm);
      adminForm.hidden = false;
      adminMessageEl.textContent = '';
      adminMessageEl.classList.remove('error');
      passwordEl.value = '';
      passwordEl.focus();
    }

    adminForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!adminUser) return;
      loginButton.disabled = true;
      await logIn(adminUser, passwordEl.value, (text) => {
        adminMessageEl.textContent = text;
        adminMessageEl.classList.add('error');
        passwordEl.value = '';
        passwordEl.focus();
      });
      loginButton.disabled = false;
    });

    function userButton(user) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = user.name;
      btn.addEventListener('click', () => (user.needs_password ? askPassword(user, btn) : logIn(user)));
      return btn;
    }

    fetch('/api/auth/users')
      .then(res => res.json())
      .then(users => {
        if (users.length === 0) {
          listEl.textContent = 'No people yet - ask the admin to add people.';
          findEl.disabled = true;
          return;
        }
        // A recent name no longer in the list (inactive or gone) is skipped.
        const byId = new Map(users.map((u) => [u.id, u]));
        const recent = readRecent().map((r) => r && byId.get(r.id)).filter(Boolean);
        for (const user of recent) recentListEl.appendChild(userButton(user));
        recentEl.hidden = recent.length === 0;

        const sorted = [...users].sort((a, b) =>
          a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        const rows = sorted.map((user) => ({ user, key: norm(user.name), btn: userButton(user) }));
        for (const row of rows) listEl.appendChild(row.btn);
        findEl.addEventListener('input', () => {
          const q = norm(findEl.value);
          for (const row of rows) row.btn.hidden = q !== '' && !row.key.includes(q);
          // The password box goes when the admin's name it sits under is filtered out.
          if (adminForm.previousElementSibling && adminForm.previousElementSibling.hidden) adminForm.hidden = true;
        });
      })
      .catch(() => showError('Could not load the user list.'));
  </script>
</body>
</html>
