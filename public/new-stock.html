<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Stock - Inventory Audit App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="new-stock.html">New Stock</a>
  </nav>

  <h1>New Stock Entry</h1>

  <div class="controls">
    <label>
      Restaurant
      <select id="restaurant"></select>
    </label>
    <label>
      Date
      <input type="date" id="business-date">
    </label>
  </div>

  <div id="meat-list">Loading...</div>

  <div class="save-bar">
    <button id="save-btn">Save</button>
    <span id="status" class="status-message"></span>
  </div>

  <script>
    const restaurantSelect = document.getElementById('restaurant');
    const dateInput = document.getElementById('business-date');
    const meatList = document.getElementById('meat-list');
    const saveBtn = document.getElementById('save-btn');
    const statusEl = document.getElementById('status');

    // Default to today
    dateInput.value = new Date().toISOString().slice(0, 10);

    async function loadRestaurants() {
      const res = await fetch('/api/restaurants');
      const restaurants = await res.json();
      restaurantSelect.innerHTML = restaurants
        .map(r => `<option value="${r.id}">${r.name}</option>`)
        .join('');
    }

    async function loadMeats() {
      const restaurantId = restaurantSelect.value;
      const date = dateInput.value;
      if (!restaurantId || !date) return;

      meatList.innerHTML = 'Loading...';
      const res = await fetch(`/api/new-stock?restaurant_id=${restaurantId}&date=${date}`);
      const meats = await res.json();

      meatList.innerHTML = meats.map(m => `
        <div class="meat-row">
          <span class="name">${m.name}</span>
          <span class="unit">${m.unit}</span>
          <input type="number" step="0.01" min="0"
                 data-meat-id="${m.meat_id}"
                 value="${m.quantity ?? ''}"
                 placeholder="0">
        </div>
      `).join('');
    }

    async function save() {
      const restaurantId = Number(restaurantSelect.value);
      const date = dateInput.value;
      const inputs = meatList.querySelectorAll('input[data-meat-id]');

      const entries = Array.from(inputs)
        .filter(input => input.value !== '')
        .map(input => ({
          meat_id: Number(input.dataset.meatId),
          quantity: Number(input.value)
        }));

      statusEl.textContent = 'Saving...';
      statusEl.className = 'status-message';

      try {
        const res = await fetch('/api/new-stock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ restaurant_id: restaurantId, business_date: date, entries })
        });
        const result = await res.json();
        if (result.ok) {
          statusEl.textContent = `Saved ${result.saved} item(s).`;
          statusEl.className = 'status-message success';
        } else {
          throw new Error(result.error || 'Unknown error');
        }
      } catch (err) {
        statusEl.textContent = 'Error saving: ' + err.message;
        statusEl.className = 'status-message error';
      }
    }

    restaurantSelect.addEventListener('change', loadMeats);
    dateInput.addEventListener('change', loadMeats);
    saveBtn.addEventListener('click', save);

    loadRestaurants().then(loadMeats);
  </script>
</body>
</html>
