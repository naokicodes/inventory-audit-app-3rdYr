<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Landing - Inventory Audit App</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { border: 1px solid #ddd; padding: 0.4rem; text-align: right; }
    th { background: #f0f0f0; text-align: center; }
    td:first-child, th:first-child { text-align: left; }
    td.calculated { background: #f7f7f7; color: #555; }
    td.na { background: #fafafa; color: #ccc; }
    input[type="number"] { width: 4.5rem; padding: 0.3rem; }
    input[type="text"] { width: 8rem; padding: 0.3rem; }
    .status-OK { color: green; font-weight: bold; }
    .status-SHORTAGE { color: crimson; font-weight: bold; }
    .status-SURPLUS { color: darkorange; font-weight: bold; }
    .status-MISSING_ACTUAL_COUNT, .status-MISSING_BEGINNING_STOCK { color: #999; font-style: italic; }
    .type-badge { font-size: 0.7em; color: #999; margin-left: 0.3em; }
    tr.dish-row td:first-child { border-left: 3px solid #ccc; }
  </style>
</head>
<body style="max-width: 1200px;">
  <nav>
    <a href="index.html">Home</a>
    <a href="daily-audit.html">Landing</a>
    <a href="stock-receipts.html">Stock Receipts</a>
    <a href="commissary.html">Commissary</a>
    <a href="settings.html">Settings</a>
    <a href="history.html">History</a>
  </nav>

  <h1>Landing</h1>
  <p style="color:#666; font-size: 0.85rem;">New Stock is read-only here - enter deliveries on the <a href="stock-receipts.html">Stock Receipts</a> page. Dish rows (Prepped / Portion Ending) are display-only for now - editing them isn't wired up yet.</p>

  <div class="controls">
    <label>
      Restaurant
      <select id="restaurant"></select>
    </label>
    <label>
      Date
      <input type="date" id="business-date">
    </label>
  </div>

  <div id="grid-container">Loading...</div>

  <div class="save-bar">
    <button id="save-btn">Save Day</button>
    <span id="status" class="status-message"></span>
  </div>

  <script>
    const restaurantSelect = document.getElementById('restaurant');
    const dateInput = document.getElementById('business-date');
    const gridContainer = document.getElementById('grid-container');
    const saveBtn = document.getElementById('save-btn');
    const statusEl = document.getElementById('status');

    dateInput.value = new Date().toISOString().slice(0, 10);

    function fmt(n) {
      return (n === null || n === undefined) ? '-' : Number(n).toFixed(2);
    }

    async function loadRestaurants() {
      const res = await fetch('/api/restaurants');
      const restaurants = await res.json();
      restaurantSelect.innerHTML = restaurants.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
    }

    // Meat row: same editable fields/save flow as before this step, plus
    // step 12's Beginning cell. Beginning is only ever editable when it's
    // null (r.beginning === null / status MISSING_BEGINNING_STOCK) - once
    // an opening_stock row exists for this meat, getBeginningStock never
    // returns null for it again, so the cell naturally reverts to
    // calculated/read-only on every later day. No separate "is this the
    // first day" check needed on the frontend - null-ness already is that
    // check.
    // Step 13: data-new-stock/data-usage are always present (fixed at load
    // - not editable on this screen, see intro paragraph above). data-
    // beginning is only present when r.beginning !== null; when it's null,
    // recalcMeatRow() reads the live .opening_stock input instead, so a
    // still-empty opening count naturally keeps the row at "-" until typed
    // (matches MISSING_BEGINNING_STOCK, same as the server would compute).
    function meatRowHtml(r) {
      const beginningAttr = r.beginning === null ? '' : ` data-beginning="${r.beginning}"`;
      const beginningCell = r.beginning === null
        ? `<td><input type="number" step="0.01" class="opening_stock" placeholder="opening count"></td>`
        : `<td class="calculated">${fmt(r.beginning)}</td>`;
      return `
        <tr data-meat-id="${r.meat_id}"${beginningAttr} data-new-stock="${r.newStock}" data-usage="${r.usage}">
          <td>${r.name} <span class="type-badge">(${r.unit})</span></td>
          ${beginningCell}
          <td class="calculated">${fmt(r.newStock)}</td>
          <td class="calculated">${fmt(r.usage)}</td>
          <td><input type="number" step="0.01" class="in_house" value="${r.in_house ?? ''}" placeholder="0"></td>
          <td><input type="number" step="0.01" class="wastage" value="${r.wastage ?? ''}" placeholder="0"></td>
          <td><input type="number" step="0.01" class="other" value="${r.other ?? ''}" placeholder="0"></td>
          <td class="calculated ending-calc">${fmt(r.endingCalculated)}</td>
          <td><input type="number" step="0.01" class="ending_actual" value="${r.actual ?? ''}" placeholder="0"></td>
          <td class="calculated over-short">${fmt(r.unexplainedVariance)}</td>
          <td><input type="text" class="remarks" value="${r.remarks || ''}" placeholder=""></td>
          <td class="row-status status-${r.status}">${r.status.replace(/_/g, ' ')}</td>
        </tr>
      `;
    }

    // Dish row: read-only per step 11 - there's no write path yet for
    // prepped/portion_ending_actual, so every cell here is calculated/
    // display-only. Beginning/New Stock/Usage columns map to the dish's
    // portion beginning/prepped/sold; In-House/Wastage/Other/Remarks
    // don't apply to dishes (no adjustments layer for portions per
    // data-model.md section 6), shown as "-" rather than left blank.
    function dishRowHtml(r) {
      return `
        <tr class="dish-row">
          <td>${r.name} <span class="type-badge">(portions)</span></td>
          <td class="calculated">${fmt(r.portionBeginning)}</td>
          <td class="calculated">${fmt(r.prepped)}</td>
          <td class="calculated">${fmt(r.sold)}</td>
          <td class="na">-</td>
          <td class="na">-</td>
          <td class="na">-</td>
          <td class="calculated">${fmt(r.portionEndingCalculated)}</td>
          <td class="calculated">${fmt(r.portionActual)}</td>
          <td class="calculated">${fmt(r.portionVariance)}</td>
          <td class="na">-</td>
          <td class="status-${r.status}">${r.status.replace(/_/g, ' ')}</td>
        </tr>
      `;
    }

    // Step 13: live recalculation of Ending(calc)/Over-Short/Status as a
    // meat row's editable inputs change, without a save+reload round trip.
    // Mirrors server/engines/auditEngine.js's computeMeatAudit exactly -
    // same formula, same EPSILON, same status thresholds - so what's shown
    // live always matches what Save+reload would produce for the same
    // inputs. New Stock and Usage are NOT part of this - they're read-only
    // calculated cells on this screen (see intro paragraph), fixed at load
    // time; only Beginning (when it's the opening-stock cell), In-House,
    // Wastage, Other, and Ending (actual) are ever live-edited here.
    const EPSILON = 0.01; // must match auditEngine.js

    // '' -> null (field genuinely empty, matches "missing" in the engine).
    // Non-numeric/partial input (e.g. a lone '-') -> null too, rather than
    // showing NaN mid-recalc while the user is still typing.
    function toNumOrNull(v) {
      if (v === '' || v === null || v === undefined) return null;
      const n = Number(v);
      return Number.isNaN(n) ? null : n;
    }

    function recalcMeatRow(tr) {
      const beginning = tr.dataset.beginning !== undefined
        ? Number(tr.dataset.beginning)
        : toNumOrNull(tr.querySelector('.opening_stock')?.value ?? '');
      const newStock = Number(tr.dataset.newStock);
      const usage = Number(tr.dataset.usage);
      const inHouse = toNumOrNull(tr.querySelector('.in_house').value) || 0;
      const wastage = toNumOrNull(tr.querySelector('.wastage').value) || 0;
      const other = toNumOrNull(tr.querySelector('.other').value) || 0;
      const actual = toNumOrNull(tr.querySelector('.ending_actual').value);

      const endingCalcCell = tr.querySelector('.ending-calc');
      const overShortCell = tr.querySelector('.over-short');
      const statusCell = tr.querySelector('.row-status');

      let endingCalculated = null, unexplainedVariance = null, status;
      if (beginning === null) {
        status = 'MISSING_BEGINNING_STOCK';
      } else {
        endingCalculated = beginning + newStock - usage;
        if (actual === null) {
          status = 'MISSING_ACTUAL_COUNT';
        } else {
          const adjustments = inHouse + wastage + other;
          const expectedEnding = endingCalculated - adjustments;
          unexplainedVariance = expectedEnding - actual;
          if (Math.abs(unexplainedVariance) <= EPSILON) status = 'OK';
          else if (unexplainedVariance > 0) status = 'SHORTAGE';
          else status = 'SURPLUS';
        }
      }

      endingCalcCell.textContent = fmt(endingCalculated);
      overShortCell.textContent = fmt(unexplainedVariance);
      statusCell.className = `row-status status-${status}`;
      statusCell.textContent = status.replace(/_/g, ' ');
    }

    // Delegated once, not re-attached per loadGrid() call - avoids stacking
    // duplicate listeners on every restaurant/date change.
    gridContainer.addEventListener('input', (e) => {
      if (!e.target.matches('.opening_stock, .in_house, .wastage, .other, .ending_actual')) return;
      const tr = e.target.closest('tr[data-meat-id]');
      if (tr) recalcMeatRow(tr);
    });

    async function loadGrid() {
      const restaurantId = restaurantSelect.value;
      const date = dateInput.value;
      if (!restaurantId || !date) return;

      gridContainer.innerHTML = 'Loading...';
      const res = await fetch(`/api/daily-audit/mixed?restaurant_id=${restaurantId}&date=${date}`);
      const rows = await res.json();

      const tableRows = rows.map(r => r.type === 'MEAT' ? meatRowHtml(r) : dishRowHtml(r)).join('');

      gridContainer.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Item</th><th>Beginning</th><th>New Stock / Prepped</th><th>Usage / Sold</th>
              <th>In-House</th><th>Wastage</th><th>Other (+/-)</th>
              <th>Ending (calc)</th><th>Ending (actual)</th><th>Over/Short</th>
              <th>Remarks</th><th>Status</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      `;
    }

    // Unchanged from before this step: only meat rows carry
    // data-meat-id, so this naturally skips dish rows - nothing to save
    // for them yet.
    async function save() {
      const restaurantId = Number(restaurantSelect.value);
      const date = dateInput.value;
      const trs = gridContainer.querySelectorAll('tr[data-meat-id]');

      const rows = Array.from(trs).map(tr => {
        const openingStockInput = tr.querySelector('.opening_stock');
        return {
          meat_id: Number(tr.dataset.meatId),
          // Only present on rows whose Beginning cell was editable this
          // load (see meatRowHtml) - the backend also enforces write-once
          // via opening_stock's UNIQUE constraint, but there's no reason
          // to send the field at all for rows that already have a
          // calculated Beginning.
          opening_stock: openingStockInput ? openingStockInput.value : undefined,
          in_house: tr.querySelector('.in_house').value,
          wastage: tr.querySelector('.wastage').value,
          other: tr.querySelector('.other').value,
          ending_actual: tr.querySelector('.ending_actual').value,
          remarks: tr.querySelector('.remarks').value
        };
      });

      statusEl.textContent = 'Saving...';
      statusEl.className = 'status-message';

      try {
        const res = await fetch('/api/daily-audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ restaurant_id: restaurantId, business_date: date, rows })
        });
        const result = await res.json();
        if (result.ok) {
          statusEl.textContent = `Saved. Reloading...`;
          statusEl.className = 'status-message success';
          await loadGrid();
          statusEl.textContent = `Saved ${result.saved} row(s).`;
        } else {
          throw new Error(result.error || 'Unknown error');
        }
      } catch (err) {
        statusEl.textContent = 'Error saving: ' + err.message;
        statusEl.className = 'status-message error';
      }
    }

    restaurantSelect.addEventListener('change', loadGrid);
    dateInput.addEventListener('change', loadGrid);
    saveBtn.addEventListener('click', save);

    loadRestaurants().then(loadGrid);
  </script>
  <script src="command-panel.js"></script>
  <script src="commands/sync-batch-stock.js"></script>
</body>
</html>
