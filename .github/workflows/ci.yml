name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite requires >= 22.13, per package.json engines.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Full test suite
        run: npm test

      - name: Write-path audit
        run: npm run audit:write-paths
